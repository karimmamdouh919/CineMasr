<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@700&display=swap');
body {
    margin: 0;
    padding: 0;
    background-color: #0f0f0f;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
}
.banner {
    width: 100%;
    height: 250px;
    background: linear-gradient(to bottom, rgba(15, 15, 15, 0) 0%, rgba(15, 15, 15, 1) 100%), url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
    position: absolute;
    top: 0;
    left: 0;
    z-index: -1;
}
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px;
    padding-top: 180px;
}
.user-name {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 40px 0;
}
.tabs {
    display: flex;
    gap: 30px;
    border-bottom: 1px solid #222;
    margin-bottom: 30px;
}
.tab {
    color: #888;
    font-size: 15px;
    padding-bottom: 12px;
    cursor: pointer;
    margin-bottom: -1px;
    border-bottom: 2px solid transparent;
    transition: color 0.2s ease;
}
.tab:hover {
    color: #bbbbbb;
}
.tab.active {
    color: #d4af37;
    border-bottom: 2px solid #d4af37;
}
.tab-content {
    display: none;
    animation: fadeIn 0.3s ease;
}
.tab-content.active {
    display: block;
}
.empty-state {
    color: #555555;
    font-size: 15px;
    padding-top: 10px;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="banner"></div>
<div class="container">
    <h1 class="user-name">Alexandra Finch</h1>
    
    <div class="tabs">
        <div class="tab active" data-target="bookings">My Bookings</div>
        <div class="tab" data-target="favorites">Favorites</div>
        <div class="tab" data-target="reviews">Reviews</div>
    </div>
    
    <div id="bookings" class="tab-content active">
        <div class="empty-state">No bookings found.</div>
    </div>
    
    <div id="favorites" class="tab-content">
        <div class="empty-state">No favorites added yet.</div>
    </div>
    
    <div id="reviews" class="tab-content">
        <div class="empty-state">No reviews submitted.</div>
    </div>
</div>

<script>
const tabs = document.querySelectorAll('.tab');
const contents = document.querySelectorAll('.tab-content');
tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        contents.forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const targetId = tab.getAttribute('data-target');
        document.getElementById(targetId).classList.add('active');
    });
});
</script>
</body>
</html>
