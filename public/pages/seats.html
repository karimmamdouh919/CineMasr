<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Seats - CineMisr</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seats.css">
  <link rel="stylesheet" href="../css/redesign.css">
</head>
<body>

 

  <a href="/public/index.html" class="home-link">← Home</a>

  <div class="seats-page">

    <div class="seats-header">
      <h1 class="page-title">Select Your Seats</h1>
      <p class="page-subtitle" id="showtimeInfo">Loading showtime...</p>
    </div>

    <div class="screen-indicator">
      <div class="screen-line"></div>
      <span class="screen-label">SCREEN</span>
    </div>

    <div class="seats-wrapper">
      <div id="seatsGrid" class="seats-grid">
        <!-- Seats generated by JS -->
      </div>
    </div>

    <div class="seats-legend">
      <div class="legend-item">
        <span class="seat-sample seat-available"></span>
        <span>Available</span>
      </div>
      <div class="legend-item">
        <span class="seat-sample seat-selected"></span>
        <span>Selected</span>
      </div>
      <div class="legend-item">
        <span class="seat-sample seat-booked"></span>
        <span>Booked</span>
      </div>
    </div>

    <div id="seatsError" class="form-error"></div>

    <div class="seats-summary glass-card">
      <div class="summary-row">
        <span>Selected seats</span>
        <span id="selectedSeatsList">None</span>
      </div>
      <div class="summary-row summary-total">
        <span>Subtotal</span>
        <span id="subtotalAmount">EGP 0</span>
      </div>
      <button type="button" id="continueBtn" class="btn-primary">Continue to Snacks</button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/seats.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/seats.js"></script>
</body>
</html>
