<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CineMisr</title>
  <link rel="stylesheet" href="C:\Users\ThinkPad\Documents\Frontend2\css\login.css">
</head>
<body>

  <a href="index.html" class="home-link">← Home</a>

  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">CineMisr</h1>
      <p class="auth-subtitle">Log in to continue your booking</p>

      <form id="loginForm" class="auth-form" novalidate>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <span class="error-message" id="passwordError"></span>
        </div>

        <div id="formError" class="form-error"></div>

        <button type="submit" id="loginBtn" class="btn-primary">
          <span class="btn-text">Log In</span>
          <span class="btn-loader" hidden></span>
        </button>

        <p class="auth-switch">
          Don't have an account? <a href="register.html">Sign up</a>
        </p>

      </form>
    </div>
  </div>

  <script src="C:\Users\ThinkPad\Documents\Frontend2\js\login.js"></script>
</body>
</html>
