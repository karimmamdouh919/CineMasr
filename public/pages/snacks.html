<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snacks - CineMisr</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seats.css">
  <link rel="stylesheet" href="../css/snacks.css">
  <link rel="stylesheet" href="../css/redesign.css">
</head>
<body>

  

  <a href="/public/index.html" class="home-link">← Home</a>

  <div class="snacks-page">

    <div class="seats-header">
      <h1 class="page-title">Add Some Snacks</h1>
      <p class="page-subtitle">Optional — you can skip this step</p>
    </div>

    <div id="snacksGrid" class="snacks-grid">
      <!-- Snack cards generated by JS -->
    </div>

    <div id="snacksError" class="form-error"></div>

    <div class="seats-summary glass-card">
      <div class="summary-row">
        <span>Snacks subtotal</span>
        <span id="snacksSubtotal">EGP 0</span>
      </div>
      <button type="button" id="continueBtn" class="btn-primary">Continue to Checkout</button>
      <button type="button" id="skipBtn" class="btn-secondary">Skip snacks</button>
    </div>

  </div>

  <script src="../js/snacks.js"></script>
</body>
</html>
