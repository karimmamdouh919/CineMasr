<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CineMisr</title>
  <link rel="stylesheet" href="C:\Users\ThinkPad\Documents\Frontend2\css\login.css">
</head>
<body>

  <body>

  <a href="index.html" class="home-link">← Home</a>

  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">CineMisr</h1>
      <p class="auth-subtitle">Create an account to start booking</p>

      <form id="registerForm" class="auth-form" novalidate>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
          <span class="error-message" id="nameError"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <span class="error-message" id="passwordError"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
          <span class="error-message" id="confirmPasswordError"></span>
        </div>

        <div id="formError" class="form-error"></div>

        <button type="submit" id="registerBtn" class="btn-primary">
          <span class="btn-text">Sign Up</span>
          <span class="btn-loader" hidden></span>
        </button>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Log in</a>
        </p>

      </form>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
