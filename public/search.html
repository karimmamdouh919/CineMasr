<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CineMisr movie booking frontend">
<title>CineMisr</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header class="navbar">
  <a class="brand" href="index.html"><span class="brand-mark">🎟</span><span>Cine<span>Misr</span></span></a>
  <nav>
    <a href="index.html" data-nav="home">Home</a>
    <a href="movies.html" data-nav="movies">Movies</a>
    <a href="search.html" data-nav="search">Search</a>
  </nav>
  <div class="nav-actions">
    <a class="icon-btn" href="search.html" aria-label="Search">⌕</a>
    <a class="avatar" href="movies.html">CM</a>
  </div>
</header>
<main class="page">
<section class="page-header"><span class="eyebrow">DISCOVER</span><h1>Search & Filter</h1><p>Find the movie that matches your mood.</p></section>
<section class="filter-panel">
  <div class="big-search"><span>⌕</span><input id="searchInput" placeholder="Search for a movie..." /><button id="searchBtn" class="btn primary">Search</button></div>
  <div class="filters">
    <label>Genre<select id="filterGenre"><option value="">All Genres</option></select></label>
    <label>Rating<select id="filterRating"><option value="">All Ratings</option><option value="8">8+ rating</option><option value="7">7+ rating</option></select></label>
    <label>Language<select id="filterLanguage"><option value="">All Languages</option><option>English</option><option>Arabic</option></select></label>
  </div>
</section>
<div class="section-heading results-heading"><div><span class="eyebrow">RESULTS</span><h2 id="resultsCount">Movies found</h2></div><select id="sortMovies"><option value="popular">Most Popular</option><option value="rating">Highest Rated</option><option value="title">Title A-Z</option></select></div>
<section class="movie-grid" id="searchResults"></section>
<div id="searchEmpty" class="empty hidden"><div>🔎</div><h3>No results</h3><p>Try changing your search or filters.</p></div>
</main><footer class="footer">
  <div><strong>Cine<span>Misr</span></strong><p>Your movie night, made simple.</p></div>
  <div class="footer-links"><a href="index.html">Home</a><a href="movies.html">Movies</a><a href="search.html">Search</a></div>
  <p class="copyright">© 2026 CineMisr — Frontend 1</p>
</footer>
<script src="js/data.js"></script><script src="js/main.js"></script><script src="js/search.js"></script>
</body></html>
